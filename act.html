<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⭐ مكتبة النجوم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --bg:#070709; --panel:#111116; --panel2:#17171e; --text:#f5f3ed;
  --muted:#a8a5ad; --gold:#d8ad55; --gold2:#f4d58a; --line:rgba(255,255,255,.09);
  --shadow:0 20px 60px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Cairo,sans-serif;background:
 radial-gradient(circle at 15% 0%,rgba(216,173,85,.12),transparent 30%),
 radial-gradient(circle at 90% 20%,rgba(100,80,180,.10),transparent 28%),
 var(--bg);color:var(--text);min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
.container{width:min(1200px,92%);margin:auto}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:24px 0}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px}
.brand-badge{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;
 background:linear-gradient(135deg,var(--gold2),var(--gold));color:#17120a;box-shadow:0 8px 25px rgba(216,173,85,.18)}
.icon-btn{border:1px solid var(--line);background:rgba(255,255,255,.04);color:#fff;
 width:44px;height:44px;border-radius:14px}
.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:32px;
 padding:52px 48px;margin:10px 0 26px;background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.015));
 box-shadow:var(--shadow)}
.hero:after{content:"";position:absolute;width:360px;height:360px;border-radius:50%;
 background:rgba(216,173,85,.10);filter:blur(20px);left:-120px;top:-170px}
.eyebrow{color:var(--gold2);font-size:13px;font-weight:800;letter-spacing:1px;margin-bottom:8px}
.hero h1{font-size:clamp(32px,5vw,58px);line-height:1.15;margin-bottom:12px}
.hero p{color:var(--muted);max-width:700px;line-height:2;font-size:15px}
.hero-stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.stat{background:rgba(255,255,255,.05);border:1px solid var(--line);padding:11px 16px;border-radius:16px}
.stat b{color:var(--gold2);font-size:20px;margin-left:5px}
.controls{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:22px 0;flex-wrap:wrap}
.search{flex:1;min-width:240px;position:relative}
.search input{width:100%;padding:16px 20px;border-radius:18px;border:1px solid var(--line);
 background:rgba(255,255,255,.05);color:#fff;outline:none}
.search input:focus{border-color:rgba(216,173,85,.65);box-shadow:0 0 0 4px rgba(216,173,85,.08)}
.filter{display:flex;gap:8px}
.filter button{border:1px solid var(--line);background:rgba(255,255,255,.04);color:#ddd;
 padding:12px 16px;border-radius:15px}
.filter button.active{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#17120a;border-color:transparent;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:18px;padding-bottom:50px}
.card{position:relative;overflow:hidden;background:linear-gradient(145deg,#15151b,#0d0d11);
 border:1px solid var(--line);border-radius:24px;padding:9px;transition:.28s;box-shadow:0 12px 35px rgba(0,0,0,.22)}
.card:hover{transform:translateY(-7px);border-color:rgba(216,173,85,.35);box-shadow:0 20px 50px rgba(0,0,0,.4)}
.photo-wrap{height:285px;position:relative;border-radius:18px;overflow:hidden;background:#222}
.card img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block;transition:.45s}
.card:hover img{transform:scale(1.035)}
.favorite{position:absolute;top:12px;left:12px;z-index:3;width:38px;height:38px;border-radius:50%;
 border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.55);backdrop-filter:blur(10px);color:#fff}
.favorite.on{color:#ffd66e;background:rgba(216,173,85,.17);border-color:rgba(216,173,85,.45)}
.photo-shade{position:absolute;inset:45% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.8))}
.card-info{padding:14px 7px 8px}
.card-info h2{font-size:18px;margin-bottom:3px}
.card-info span{font-size:12px;color:var(--muted)}
.open{width:100%;margin-top:10px;padding:11px;border:0;border-radius:14px;background:#fff;color:#111;font-weight:800}
.open:hover{background:var(--gold2)}
.empty{text-align:center;color:var(--muted);padding:60px 0;grid-column:1/-1}
.modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.82);backdrop-filter:blur(12px);padding:20px;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-box{width:min(920px,100%);max-height:92vh;overflow:auto;background:#101014;border:1px solid var(--line);
 border-radius:30px;box-shadow:var(--shadow);position:relative}
.close{position:absolute;top:16px;left:16px;z-index:3;width:42px;height:42px;border-radius:50%;
 border:1px solid var(--line);background:rgba(0,0,0,.55);color:#fff}
.profile-top{display:grid;grid-template-columns:260px 1fr;gap:28px;padding:30px}
.profile-main-img{width:100%;height:350px;object-fit:cover;object-position:top center;border-radius:22px}
.profile-copy{display:flex;flex-direction:column;justify-content:center}
.profile-copy .tag{color:var(--gold2);font-size:12px;font-weight:800;margin-bottom:8px}
.profile-copy h2{font-size:38px;margin-bottom:12px}
.profile-copy p{color:#c3c0c7;line-height:2;font-size:14px}
.works{padding:0 30px 30px}
.works h3{margin-bottom:14px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.gallery img{width:100%;height:155px;object-fit:cover;border-radius:14px;cursor:pointer}
.lightbox{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.94);align-items:center;justify-content:center;padding:25px}
.lightbox.show{display:flex}
.lightbox img{max-width:92vw;max-height:88vh;object-fit:contain;border-radius:16px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(30px);
 background:#fff;color:#111;padding:12px 18px;border-radius:14px;font-weight:800;opacity:0;pointer-events:none;transition:.3s;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:650px){
 .hero{padding:34px 24px;border-radius:25px}
 .topbar{padding:16px 0}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
 .photo-wrap{height:235px}
 .card{border-radius:19px}
 .profile-top{grid-template-columns:1fr;padding:22px}
 .profile-main-img{height:340px}
 .profile-copy h2{font-size:30px}
 .works{padding:0 22px 22px}
}
</style>
</head>

<div class="container">
  <div class="topbar">
    <div class="brand"><div class="brand-badge">★</div><span>مكتبة النجوم</span></div>

    </div>
  </div>

</div>

let favorites = JSON.parse(localStorage.getItem('goldenBeeFavorites') || '[]');
let showFavorites = false;

function saveFavorites() {
  localStorage.setItem('goldenBeeFavorites', JSON.stringify(favorites));
}

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const list = PEOPLE.filter(p => {
    const match = p.name.toLowerCase().includes(q);
    const fav = favorites.includes(p.id);
    return match && (!showFavorites || fav);
  });

  document.getElementById('count').textContent = PEOPLE.length;
  document.getElementById('favCount').textContent = favorites.length;

  const grid = document.getElementById('grid');
  if (!list.length) {
    grid.innerHTML = '<div class="empty">لا يوجد نتائج مطابقة 🔎</div>';
    return;
  }

  grid.innerHTML = list.map(p => `
    <article class="card">
      <div class="photo-wrap" onclick="openProfile('${p.id}')">
        <button class="favorite ${favorites.includes(p.id) ? 'on' : ''}"
          onclick="event.stopPropagation(); toggleFavorite('${p.id}')">${favorites.includes(p.id) ? '★' : '☆'}</button>
        <img src="${p.image}" alt="${p.name}" loading="lazy">
        <div class="photo-shade"></div>
      </div>
      <div class="card-info">
        <h2>${p.name}</h2>
        <span>مكتبة النجوم</span>
        <button class="open" onclick="openProfile('${p.id}')">استكشف الملف</button>
      </div>
    </article>
  `).join('');
}

function toggleFavorite(id) {
  favorites = favorites.includes(id)
    ? favorites.filter(x => x !== id)
    : [...favorites, id];
  saveFavorites();
  render();
  showToast(favorites.includes(id) ? 'تمت الإضافة إلى المفضل ⭐' : 'تمت الإزالة من المفضل');
}

function openProfile(id) {
  const p = PEOPLE.find(x => x.id === id);
  if (!p) return;
  document.getElementById('profileImg').src = p.image;
  document.getElementById('profileName').textContent = p.name;
  document.getElementById('profileDesc').textContent = p.desc || 'لا يوجد وصف بعد.';
  document.getElementById('gallery').innerHTML = (p.works || []).map(w =>
    `<img src="${w}" alt="${p.name}" onclick="openLightbox('${w}')" loading="lazy">`
  ).join('') || '<p style="color:#999">لا توجد أعمال مضافة بعد.</p>';
  document.getElementById('modal').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeProfile() {
  document.getElementById('modal').classList.remove('show');
  document.body.style.overflow = '';
}

function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('show');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('show');
}

function showToast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('allBtn').onclick = () => {
  showFavorites = false;
  document.getElementById('allBtn').classList.add('active');
  document.getElementById('favBtn').classList.remove('active');
  render();
};
document.getElementById('favBtn').onclick = () => {
  showFavorites = true;
  document.getElementById('favBtn').classList.add('active');
  document.getElementById('allBtn').classList.remove('active');
  render();
};
document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeProfile();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeProfile();
    closeLightbox();
  }
});
render();
</script>
